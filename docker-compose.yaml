version: '3.8'

services:
  app:
    build: 
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "7070:7070"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - FLASK_SECRET_KEY=${FLASK_SECRET_KEY}
      - FLASK_APP=app.py
      - FLASK_ENV=production
      - GUNICORN_CMD_ARGS="--workers=4 --bind=0.0.0.0:7070 --timeout=120"
      - POSTGRES_HOST=db
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=ridesharedb
      - POSTGRES_PORT=5432
    restart: always
    volumes:
      - type: bind
        source: ./app
        target: /app

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.react
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://107.23.132.119:7070
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    depends_on:
      - app